<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0867E8"/>
    <stop offset="1" stop-color="#061C4A"/>
  </linearGradient>
  <linearGradient id="key" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#16DDF3"/>
    <stop offset="1" stop-color="#0AA8FF"/>
  </linearGradient>
</defs>
<rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
<!-- open box -->
<path d="M25 54 L64 36 L103 54 L64 72 Z" fill="#DCEBFF"/>
<path d="M25 54 L64 72 L64 108 L25 90 Z" fill="#B9D5FF"/>
<path d="M64 72 L103 54 L103 90 L64 108 Z" fill="#0B1733"/>
<!-- agent head -->
<rect x="43" y="27" width="42" height="34" rx="17" fill="#F4F8FF"/>
<rect x="49" y="35" width="30" height="18" rx="8" fill="#0B1733"/>
<circle cx="58" cy="44" r="3.2" fill="#16DDF3"/>
<circle cx="70" cy="44" r="3.2" fill="#16DDF3"/>
<!-- request signal -->
<path d="M88 29 l5 -7 M94 36 l8 -3" stroke="#16DDF3" stroke-width="5" stroke-linecap="round"/>
<!-- conventional key: teeth at LEFT/front, circular bow at RIGHT/rear -->
<path d="M73 82 H87" stroke="url(#key)" stroke-width="8" stroke-linecap="round"/>
<path d="M73 82 H55 V90 H47 V82 H39" stroke="url(#key)" stroke-width="8" stroke-linecap="square" stroke-linejoin="round"/>
<circle cx="93" cy="82" r="11" fill="none" stroke="url(#key)" stroke-width="8"/>
</svg>