name: Bug report
description: Report a reproducible AgentKeyBox problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include real secrets, private keys, or production .env contents. Security vulnerabilities belong in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Coding agent
      options: [Claude Code, Codex, Not agent-specific, Other]
